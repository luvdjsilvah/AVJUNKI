<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>DJ Services | AV Junki</title>

  <meta
    name="description"
    content="Professional Las Vegas DJ services for weddings, private events, corporate events, graduations and celebrations."
  >

  <link rel="stylesheet" href="dj.css">
</head>

<body>

  <main class="dj-page">

    <section class="dj-stage">

      <!-- BACKGROUND -->
      <img
        src="assets/images/dj-bg.png"
        alt=""
        class="dj-layer dj-background"
        draggable="false"
      >

      <!-- LEFT SPEAKER -->
      <img
        src="assets/images/dj-speaker-left.png"
        alt=""
        class="dj-layer dj-speaker dj-speaker-left"
        draggable="false"
      >

      <!-- RIGHT SPEAKER -->
      <img
        src="assets/images/dj-speaker-right.png"
        alt=""
        class="dj-layer dj-speaker dj-speaker-right"
        draggable="false"
      >

      <!-- CHARLES -->
      <img
        src="assets/images/dj-charles.png"
        alt="AV Junki professional DJ"
        class="dj-layer dj-charles"
        draggable="false"
      >

      <!-- VIDEO -->
      <div class="dj-video-wrap">

        <video
          class="dj-video"
          autoplay
          muted
          loop
          playsinline
          preload="metadata"
        >
          <source
            src="assets/videos/dj-booth-loop.mp4"
            type="video/mp4"
          >
        </video>

      </div>

      <!-- DJ BOOTH -->
      <img
        src="assets/images/dj-booth.png"
        alt=""
        class="dj-layer dj-booth"
        draggable="false"
      >

      <!-- LEFT LIGHT -->
      <img
        src="assets/images/dj-light-left.png"
        alt=""
        class="dj-layer dj-light dj-light-left"
        draggable="false"
      >

      <!-- RIGHT LIGHT -->
      <img
        src="assets/images/dj-light-right.png"
        alt=""
        class="dj-layer dj-light dj-light-right"
        draggable="false"
      >

    </section>

  </main>

  <script src="dj.js"></script>

</body>
</html>
