<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Explore the AV Junki photography gallery featuring professional event, portrait, branding, and creative photography in Henderson, Nevada and the Las Vegas area."
  >

  <title>AV Junki | Photography Gallery</title>
<link rel="canonical" href="https://avjunki.com/gallery.html">

<meta property="og:type" content="website">
<meta property="og:title" content="Photography Gallery in Henderson and Las Vegas | AV Junki">
<meta property="og:description" content="Explore the AV Junki Photography Gallery featuring professional event, portrait, branding, and creative photography in Henderson, Nevada and the Las Vegas area.">
<meta property="og:url" content="https://avjunki.com/gallery.html">
<meta property="og:site_name" content="AV Junki">
  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
   href="gallery.css?v=20260824-0121"
  >

</head>


<body>


  <!-- =========================
       HEADER
       ========================= -->

  <header class="gallery-header">

    <a
      class="gallery-brand"
      href="index.html"
    >
      AV JUNKI
    </a>


    <nav
      class="gallery-nav"
      aria-label="Gallery navigation"
    >

      <a href="index.html#services">
        Services
      </a>

      <a href="index.html#portfolio">
        Portfolio
      </a>

      <a href="index.html#about">
        About
      </a>

      <a href="index.html#contact">
        Contact
      </a>

      <a
        class="gallery-book-button"
        href="https://calendly.com/luvdjsilvah/av-junki-consultation"
        target="_blank"
        rel="noopener noreferrer"
      >
        Book Consultation
      </a>

    </nav>

  </header>



  <!-- =========================
       MAIN GALLERY
       ========================= -->

  <main class="gallery-page">

    <section class="gallery-stage">


      <!-- =========================
           LEFT SIDE
           ========================= -->

      <div class="gallery-intro">


        <div class="gallery-copy">

          <p class="gallery-hello">
            Hello,
          </p>


          <h1>

            Welcome to the

            <span>
              AV Junki
            </span>

            Photography Gallery.

          </h1>


          <p class="gallery-instructions">

            Click the

            <strong>
              PLAY
            </strong>

            button on the camera to get started.

          </p>

        </div>



        <!-- MODEL -->

        <div class="gallery-model-wrap">

          <img
            class="gallery-model"
            src="assets/images/gallery-model.png"
            alt="AV Junki photography gallery host"
          >

        </div>
<div class="gallery-head-play-wrap">

  <button
    id="gallery-head-play"
    class="gallery-head-play"
    type="button"
    aria-label="Start photography gallery"
  >
    ▶
  </button>

  <p>
    CLICK PLAY TO START GALLERY
  </p>

</div>
      </div>



      <!-- =========================
           RIGHT SIDE / CAMERA
           ========================= -->

      <div class="camera-gallery">


        <div class="camera-wrap">


          <!-- CAMERA BODY -->

          <img
            class="camera-body"
            src="assets/images/camera-back.png"
            alt="Camera used as interactive AV Junki photo gallery"
          >



          <!-- =========================
               CAMERA LCD
               ========================= -->

          <div class="camera-screen">


            <img
              id="gallery-photo"
              src="assets/images/V-pic-1.jpg"
              alt="AV Junki photography slideshow image"
            >


            <!-- CLICK LCD TO ENLARGE -->

            <button
              id="gallery-enlarge"
              class="gallery-enlarge-hotspot"
              type="button"
              aria-label="View full photograph"
              title="Click to view full photograph"
            >
            </button>


          </div>



          <!-- =========================
               CAMERA HOTSPOTS
               ========================= -->


          <button
            id="camera-play-button"
            class="camera-hotspot camera-play-hotspot"
            type="button"
            aria-label="Play photography slideshow"
          >
          </button>


          <button
            id="camera-prev-button"
            class="camera-hotspot camera-prev-hotspot"
            type="button"
            aria-label="Previous photograph"
          >
          </button>


          <button
            id="camera-next-button"
            class="camera-hotspot camera-next-hotspot"
            type="button"
            aria-label="Next photograph"
          >
          </button>


        </div>



        <!-- =========================
             VISIBLE CONTROLS
             ========================= -->

        <div class="gallery-controls">


          <button
            id="gallery-prev"
            class="gallery-control-button"
            type="button"
          >
            ← Prev
          </button>


          <button
            id="gallery-play"
            class="gallery-main-play"
            type="button"
            aria-label="Play slideshow"
          >
            ▶
          </button>


          <button
            id="gallery-next"
            class="gallery-control-button"
            type="button"
          >
            Next →
          </button>


        </div>


        <p class="gallery-status">
          Click Play to Start Gallery
        </p>


      </div>

    </section>

  </main>



  <!-- =========================
       FOOTER
       ========================= -->

  <footer class="gallery-footer">


    <div class="gallery-footer-logo">

      <img
        src="assets/images/avjunki-logo.png"
        alt="AV Junki"
      >

    </div>



    <div class="gallery-social">

      <span>
        Follow AV Junki
      </span>


      <a
        href="https://www.instagram.com/luvdjsilvah/"
        target="_blank"
        rel="noopener noreferrer"
      >
        Instagram
      </a>


      <a
        href="https://www.facebook.com/Luvdjsilvah"
        target="_blank"
        rel="noopener noreferrer"
      >
        Facebook
      </a>


      <a
        href="https://www.tiktok.com/@luvdjsilvah?lang=en"
        target="_blank"
        rel="noopener noreferrer"
      >
        TikTok
      </a>


      <a
        href="https://www.youtube.com/@Luvdjsilvah"
        target="_blank"
        rel="noopener noreferrer"
      >
        YouTube
      </a>

    </div>



    <a
      class="gallery-domain"
      href="index.html"
    >
      AVJUNKI.COM
    </a>


  </footer>



  <!-- ==================================================
       FULL IMAGE LIGHTBOX
       HIDDEN UNTIL LCD PHOTO IS CLICKED
       ================================================== -->

  <div
    id="gallery-lightbox"
    class="gallery-lightbox"
    role="dialog"
    aria-modal="true"
    aria-label="Full size photograph viewer"
    hidden
  >


    <!-- CLICK BACKGROUND TO CLOSE -->

    <button
      id="lightbox-background"
      class="lightbox-background"
      type="button"
      aria-label="Close full photograph"
    >
    </button>



    <!-- CLOSE BUTTON -->

    <button
      id="lightbox-close"
      class="lightbox-close"
      type="button"
      aria-label="Close full photograph"
    >
      ×
    </button>



    <!-- PREVIOUS -->

    <button
      id="lightbox-prev"
      class="lightbox-arrow lightbox-prev"
      type="button"
      aria-label="Previous photograph"
    >
      ‹
    </button>



    <!-- FULL ORIGINAL PHOTO -->

    <div class="lightbox-image-wrap">

      <img
        id="lightbox-image"
        src="assets/images/V-pic-1.jpg"
        alt="Full size AV Junki photograph"
      >

    </div>



    <!-- NEXT -->

    <button
      id="lightbox-next"
      class="lightbox-arrow lightbox-next"
      type="button"
      aria-label="Next photograph"
    >
      ›
    </button>



    <!-- PHOTO COUNTER -->

    <div
      id="lightbox-counter"
      class="lightbox-counter"
    >
      1 / 24
    </div>


  </div>



  <script src="gallery.js"></script>


</body>

</html>
