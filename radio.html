<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>AV Junki Radio</title>

  <meta
    name="description"
    content="AV Junki Radio — music, podcasts, live audio, events, artists and interactive radio."
  />

  <link
    rel="stylesheet"
    href="radio.css?v=2"
  />
</head>

<body>

  <main id="radio-app">

    <section id="radio-hero">

      <!-- LOCKED MASTER HERO -->
      <img
        id="radio-hero-image"
        src="assets/images/Hero-Radio.webp"
        alt="AV Junki Radio virtual studio"
      />


      <!-- =========================================
           CEILING GLOBE AREA
      ========================================== -->

      <div
        id="ceiling-globe"
        aria-hidden="true"
      ></div>


      <!-- =========================================
           INVISIBLE BAKED-NAV HOTSPOTS
      ========================================== -->

      <nav
        id="radio-navigation"
        aria-label="AV Junki Radio navigation"
      >

        <a
          id="nav-home"
          class="nav-hotspot"
          href="index.html"
          aria-label="Home"
          title="Home"
        ></a>

        <a
          id="nav-radio"
          class="nav-hotspot"
          href="radio.html"
          aria-label="Radio"
          title="Radio"
        ></a>

        <button
          id="nav-podcast"
          class="nav-hotspot"
          type="button"
          data-screen="podcasts"
          aria-label="Podcast"
          title="Podcast"
        ></button>

        <button
          id="nav-events"
          class="nav-hotspot"
          type="button"
          data-screen="events"
          aria-label="Events"
          title="Events"
        ></button>

        <button
          id="nav-news"
          class="nav-hotspot"
          type="button"
          data-screen="news"
          aria-label="News"
          title="News"
        ></button>

        <button
          id="nav-shop"
          class="nav-hotspot"
          type="button"
          data-screen="shop"
          aria-label="Shop"
          title="Shop"
        ></button>

        <button
          id="nav-community"
          class="nav-hotspot"
          type="button"
          data-screen="community"
          aria-label="Community"
          title="Community"
        ></button>

        <button
          id="nav-advertise"
          class="nav-hotspot"
          type="button"
          data-screen="advertise"
          aria-label="Advertise"
          title="Advertise"
        ></button>

        <button
          id="nav-contact"
          class="nav-hotspot"
          type="button"
          data-screen="contact"
          aria-label="Contact"
          title="Contact"
        ></button>

        <button
          id="nav-search"
          class="nav-hotspot"
          type="button"
          data-screen="search"
          aria-label="Search"
          title="Search"
        ></button>

        <button
          id="nav-inquiry"
          class="nav-hotspot"
          type="button"
          data-screen="inquiry"
          aria-label="Inquiry"
          title="Inquiry"
        ></button>

        <button
          id="nav-about"
          class="nav-hotspot"
          type="button"
          data-screen="about"
          aria-label="About"
          title="About"
        ></button>

      </nav>


      <!-- =========================================
           CENTER SCREEN
      ========================================== -->

      <section
        id="center-screen"
        aria-label="AV Junki Radio information screen"
      >
        <div id="screen-content"></div>
      </section>


      <!-- =========================================
           LEFT GENRE HOTSPOTS
      ========================================== -->

      <button
        id="hip-hop-panel"
        class="panel-hotspot"
        type="button"
        data-channel="hip-hop"
        data-preset="music"
        aria-label="Hip Hop"
      ></button>

      <button
        id="rnb-panel"
        class="panel-hotspot"
        type="button"
        data-channel="rnb"
        data-preset="music"
        aria-label="R&B"
      ></button>

      <button
        id="house-panel"
        class="panel-hotspot"
        type="button"
        data-channel="house"
        data-preset="music"
        aria-label="House"
      ></button>

      <button
        id="reggae-panel"
        class="panel-hotspot"
        type="button"
        data-channel="reggae"
        data-preset="music"
        aria-label="Reggae"
      ></button>


      <!-- =========================================
           RIGHT PANEL HOTSPOTS
      ========================================== -->

      <button
        id="podcast-panel"
        class="panel-hotspot"
        type="button"
        data-channel="podcast"
        data-preset="podcast"
        aria-label="Podcast"
      ></button>

      <button
        id="live-1-panel"
        class="panel-hotspot"
        type="button"
        data-channel="live-1"
        data-preset="live"
        aria-label="Live 1"
      ></button>

      <button
        id="live-2-panel"
        class="panel-hotspot"
        type="button"
        data-channel="live-2"
        data-preset="live"
        aria-label="Live 2"
      ></button>

      <button
        id="gospel-panel"
        class="panel-hotspot"
        type="button"
        data-channel="gospel"
        data-preset="music"
        aria-label="Gospel"
      ></button>


      <!-- =========================================
           VIRTUAL CHARLES
      ========================================== -->

      <section
        id="virtual-host"
        aria-label="AV Junki Radio virtual welcome"
      >

        <div id="virtual-host-character"></div>

        <button
          id="skip-welcome"
          type="button"
        >
          Skip Welcome
        </button>

      </section>


      <!-- =========================================
           NEW BROADCAST PLAYER
      ========================================== -->

      <section
        id="broadcast-player"
        aria-label="AV Junki Radio broadcast player"
      >

        <!-- ALBUM ART -->
        <div id="player-album-art"></div>


        <!-- TRACK INFO -->
        <div id="player-track-info">

          <div id="player-track-title">
            AV Junki Radio
          </div>

          <div id="player-artist">
            Music Lives Here
          </div>

        </div>


        <!-- SPECTRUM -->
        <div id="spectrum-wrap">

          <canvas
            id="spectrum-canvas"
            aria-label="Audio spectrum analyzer"
          ></canvas>

        </div>


        <!-- ANALOG VU -->
        <div id="analog-vu">

          <img
            id="vu-face"
            src="assets/images/vu-meter.png"
            alt="Analog VU meter"
          />

          <div id="vu-needle"></div>

        </div>


        <!-- GAIN REDUCTION -->
        <div id="gr-meter-wrap">

          <div id="gr-label">
            GR
          </div>

          <div id="gr-meter">

            <div id="gr-fill"></div>

          </div>

          <div id="gr-value">
            0 dB
          </div>

        </div>


        <!-- DSP STATUS -->
        <div id="dsp-status">

          <span id="dsp-light"></span>

          <span id="dsp-text">
            DSP
          </span>

        </div>


        <!-- TRANSPORT -->
        <div id="player-controls">

          <button
            id="previous-track"
            type="button"
            aria-label="Previous"
          >
            ◀
          </button>

          <button
            id="play-pause"
            type="button"
            aria-label="Play"
          >
            ▶
          </button>

          <button
            id="next-track"
            type="button"
            aria-label="Next"
          >
            ▶
          </button>

        </div>


        <!-- VOLUME -->
        <div id="volume-control">

          <label
            for="volume-slider"
            class="sr-only"
          >
            Volume
          </label>

          <input
            id="volume-slider"
            type="range"
            min="0"
            max="100"
            value="80"
          />

        </div>


        <!-- AUDIO ENGINE -->
        <audio
          id="radio-audio"
          preload="metadata"
          crossorigin="anonymous"
        ></audio>

      </section>


      <!-- =========================================
           STATUS
      ========================================== -->

      <div
        id="radio-status"
        role="status"
        aria-live="polite"
      ></div>

    </section>

  </main>

  <script src="radio.js"></script>

</body>
</html>
